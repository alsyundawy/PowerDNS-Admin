[flake8]
max-line-length = 120
extend-ignore = E203, E266, E501, W503
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    build,
    dist,
    migrations,
    node_modules,
    .trunk
per-file-ignores =
    __init__.py:F401
    powerdnsadmin/models/__init__.py:F401
    powerdnsadmin/routes/__init__.py:F401
    migrations/*:F401,F841,E122,E128
