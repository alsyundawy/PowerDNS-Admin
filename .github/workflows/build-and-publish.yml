---
name: Docker Image

"on":
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
    tags:
      - v*.*.*
    paths-ignore:
      - .github/**
      - deploy/**
      - docker-test/**
      - docs/**
      - .dockerignore
      - .gitattributes
      - .gitignore
      - .lgtm.yml
      - .whitesource
      - .yarnrc
      - docker-compose.yml
      - docker-compose-test.yml
      - LICENSE
      - README.md
      - SECURITY.md

permissions:
  contents: read

jobs:
  build-and-push-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets[format('{0}', 'DOCKERHUB_USERNAME_V2')] }}
      DOCKERHUB_TOKEN: ${{ secrets[format('{0}', 'DOCKERHUB_TOKEN_V2')] }}

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7

      - name: Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            alsyundawy/pda-legacy
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: QEMU Setup
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx Setup
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Authentication
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker Image Build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: ./
          file: ./docker/Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: alsyundawy/pda-legacy:${{ github.ref_name }}

      - name: Docker Image Release Tagging
        uses: docker/build-push-action@v6
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          env.DOCKERHUB_USERNAME != '' &&
          env.DOCKERHUB_TOKEN != ''
        with:
          platforms: linux/amd64,linux/arm64
          context: ./
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
